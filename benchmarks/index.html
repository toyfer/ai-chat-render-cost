<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Render Cost Benchmark</title>
  <link rel="stylesheet" href="/vendor/katex.min.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 15px;
      line-height: 1.65;
    }
    #chat {
      height: 100vh;
      overflow-y: auto;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 14px;
      border-radius: 10px;
      background: #1e293b;
      overflow-wrap: anywhere;
    }
    .msg.user {
      background: #1e3a5f;
      align-self: flex-end;
      max-width: 85%;
    }
    .msg.assistant {
      background: #1e293b;
    }
    .plain-text {
      white-space: pre-wrap;
      margin: 0;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.65;
    }
    pre {
      background: #0b1120;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 8px 0;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #334155;
      padding: 6px 8px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const entry = params.get("entry") || "vanilla-eco";
    const s = document.createElement("script");
    s.src = "/dist/" + encodeURIComponent(entry) + ".bundle.js";
    document.body.appendChild(s);
  </script>
</body>
</html>
